<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Apache does NOT put the Authorization header into $_SERVER by
        # default (it's reserved for Apache's own auth modules) — every
        # signed request here (Sigv4_signer / Aws_sigv4_signer both read
        # $_SERVER['HTTP_AUTHORIZATION']) would otherwise 403 with
        # "MissingAuthorizationHeader" even though the client did send it.
        CGIPassAuth On
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} ^(.*)
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%1]

        # Same front-controller routing as docker/nginx/default.conf's
        # try_files: CodeIgniter's index_page is '' (clean URLs), so every
        # request that isn't a real file/dir on disk goes to index.php.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
